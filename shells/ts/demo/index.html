<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camerakit demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  /* Front camera preview mirrors like a mirror would - CSS, not shader
     math, so it flips the finished frame (preview and its landmark
     overlay together) without touching how any beauty effect samples
     or aligns against the underlying, unmirrored texture space. */
  canvas { width: 100vw; height: 100vh; display: block; transform: scaleX(-1); }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #status { position: fixed; top: 12px; left: 12px; color: #fff; font: 13px monospace; white-space: pre; }
  #controls { position: fixed; bottom: 12px; left: 12px; color: #fff; font: 13px monospace; }
</style>
</head>
<body>
<canvas id="preview" width="1280" height="720"></canvas>
<canvas id="overlay" width="1280" height="720"></canvas>
<div id="status">loading</div>
<div id="controls">
  whiten <input id="whiten" type="range" min="0" max="1" step="0.01" value="0">
  smooth <input id="smooth" type="range" min="0" max="1" step="0.01" value="0">
  thin face <input id="thin-face" type="range" min="0" max="1" step="0.01" value="0">
  big eye <input id="big-eye" type="range" min="0" max="0.15" step="0.005" value="0">
  lipstick <input id="lipstick" type="range" min="0" max="0.5" step="0.01" value="0">
  blush <input id="blush" type="range" min="0" max="0.5" step="0.01" value="0">
</div>
<script type="module" src="dist.js"></script>
</body>
</html>

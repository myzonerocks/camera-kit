name: GosslensDemo
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6"
packages:
  Gosslens:
    path: ../Gosslens
targets:
  GosslensDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../../.models/face_landmarker.task
        buildPhase: resources
        optional: true
      - path: ../../../.models/corpus/face_frontal_b.jpg
        buildPhase: resources
        optional: true
      - path: ../../../.vendor/gpupixel/src/res
        type: folder
        buildPhase: resources
        optional: true
      - path: ../../../lenses/reference/beauty-baseline
        type: folder
        buildPhase: resources
        optional: true
      - path: ../../../.lens-packages/shader-tint
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: Gosslens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gosslens.demo
        DEVELOPMENT_TEAM: 9ZCMLRAW4V
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)/../../../include"]
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": ["$(PROJECT_DIR)/../../../zig-out/ios"]
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(PROJECT_DIR)/../../../zig-out/ios-simulator"]
        OTHER_LDFLAGS:
          - "-lgosslens"
          - "-lgpupixel"
          - "-lyuv"
          - "-lbgfx"
          - "-ltflite"
          - "-lxnnpack"
          - "-lxnnpack-fp16arith"
          - "-lxnnpack-neonfp16arith"
          - "-lxnnpack-neonfp16arith_aarch64"
          - "-lxnnpack-neondot"
          - "-lxnnpack-neondot_aarch64"
          - "-lxnnpack-neondotfp16arith"
          - "-lxnnpack-neoni8mm"
          - "-lxnnpack-aarch64"
          - "-labsl"
          - "-lruy"
          - "-lfarmhash"
          - "-lfft2d"
          - "-lflatbuffers"
          - "-lcpuinfo"
          - "-lpthreadpool"
          - "-lc++"
          - "-framework"
          - "Metal"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "OpenGLES"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: Shows the live camera preview.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

name: CameraKitDemo
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  CameraKitDemo:
    type: application
    platform: iOS
    sources: [Sources]
    resources:
      - path: ../../../.models/face_landmarker.task
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kit.camera.demo
        DEVELOPMENT_TEAM: 9ZCMLRAW4V
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)/../../../include"]
        LIBRARY_SEARCH_PATHS: ["$(PROJECT_DIR)/../../../zig-out/ios"]
        OTHER_LDFLAGS:
          - "-lcamerakit"
          - "-lbgfx"
          - "-ltflite"
          - "-lxnnpack"
          - "-lxnnpack-fp16arith"
          - "-lxnnpack-neonfp16arith"
          - "-lxnnpack-neonfp16arith_aarch64"
          - "-lxnnpack-neondot"
          - "-lxnnpack-neondot_aarch64"
          - "-lxnnpack-neondotfp16arith"
          - "-lxnnpack-neoni8mm"
          - "-lxnnpack-aarch64"
          - "-labsl"
          - "-lruy"
          - "-lfarmhash"
          - "-lfft2d"
          - "-lcpuinfo"
          - "-lpthreadpool"
          - "-lc++"
          - "-framework"
          - "Metal"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "AVFoundation"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: Shows the live camera preview.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

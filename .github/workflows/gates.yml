name: gates

# Push runs on main exist to validate the merge and to save the warm
# build caches; pull request runs restore those caches and never save
# compilation state, so the shared cache pool stays unevicted and every
# fresh branch starts from main's warm world instead of a cold build.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: pr body shape
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          zig build gate -- --pr-body "$RUNNER_TEMP/pr_body.txt"
      - uses: actions/cache@v4
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: zig build vendor-sync
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: zig build fetch-models
      - uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: gate suite
        run: zig build ci
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}

  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: zig build vendor-sync
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: zig build fetch-models
      - uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: tracking harness
        run: zig build tracking-harness
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: zig build vendor-sync
      - uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: android library
        run: zig build android
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install
        working-directory: sdk/ts
      - name: build
        run: bun run build
        working-directory: sdk/ts
      - name: test
        run: bun test
        working-directory: sdk/ts

  lens-shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: zig build vendor-sync
      - uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: lens validator shader tests
        run: zig build test -Dlens-shaders=true
      - name: validate reference lenses
        run: zig build lens-validate-reference
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}

name: GosslensDemo
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6"
packages:
  Gosslens:
    path: ..
targets:
  GosslensDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../../.models/face_landmarker.task
        buildPhase: resources
        optional: true
      - path: ../../../.models/gesture_recognizer.task
        buildPhase: resources
        optional: true
      - path: ../../../.models/pose_landmarker_full.task
        buildPhase: resources
        optional: true
      - path: ../../../.models/corpus/face_frontal_b.jpg
        buildPhase: resources
        optional: true
      - path: ../../../.vendor/gpupixel/src/res
        type: folder
        buildPhase: resources
        optional: true
      - path: ../../../lenses/reference/beauty-baseline
        type: folder
        buildPhase: resources
        optional: true
      - path: ../../../.lens-packages/shader-tint
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: Gosslens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gosslens.demo
        DEVELOPMENT_TEAM: 9ZCMLRAW4V
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        # The engine's -l list and frameworks now ride on the Gosslens
        # package's linkerSettings; this target inherits them by depending on
        # the package. Only the per-slice search paths, which the package
        # can't know, stay here.
        HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)/../../../include"]
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": ["$(PROJECT_DIR)/../../../zig-out/ios"]
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(PROJECT_DIR)/../../../zig-out/ios-simulator"]
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: Shows the live camera preview.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
